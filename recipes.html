<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recipes">
<link rel="manifest" href="recipes.webmanifest">
<link rel="apple-touch-icon" href="recipe-180.png">
<link rel="icon" href="recipe-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<title>Recipes</title>
<style>
/* Same black + electric blue system as Daily Ledger. Layout: one column of recipe cards; recipe, edit and cooking views slide over as full-screen sheets. */
:root{
  --bg:#0b0b0d; --surface:#151518; --raised:#1c1d21; --ink:#f2f3f5; --muted:#9097a3; --line:#27282e;
  --accent:#2f7bff; --accent-soft:#12254d; --on-accent:#ffffff; --empty:#202127;
  --gold:#f5c542; --good:#3ecf8e; --warn:#ffb020; --bad:#ff5a5f;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.src{font-size:12px;color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:grid;gap:14px}
.appbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.appbar h1{font-size:clamp(24px,6vw,34px);font-weight:800}
.menuwrap{position:relative}
.pill{display:flex;align-items:center;gap:8px;background:var(--raised);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:600;white-space:nowrap}
.pill svg{width:10px;height:7px;flex:none}
.pill[aria-expanded="true"]{border-color:var(--accent)}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:min(280px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:2px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.menu button,.menu a{display:grid;gap:2px;text-align:left;background:none;border:0;border-radius:8px;padding:10px 12px;color:var(--ink);text-decoration:none}
.menu b{font-weight:600}
.menu span{font-size:12px;color:var(--muted)}
.menu button:hover,.menu a:hover{background:var(--raised)}
.menu [aria-current="true"]{background:var(--accent-soft)}
.menu [aria-current="true"] b{color:var(--accent)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.field{font-size:16px;width:100%;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
textarea.field{resize:vertical;min-height:120px;line-height:1.5}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .field{flex:1 1 200px}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--bad);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--raised);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}

/* recipe list */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:stretch;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0}
.card:hover{border-color:#3a3c44}
.thumb{width:96px;height:96px;border-radius:9px;object-fit:cover;background:var(--raised);display:block}
.thumb.ph{display:grid;place-items:center;color:var(--muted)}
.cbody{display:grid;align-content:space-between;gap:6px;min-width:0;padding-block:2px}
.ctitle{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.star{color:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:28px 12px;display:grid;gap:6px}
.empty b{color:var(--ink);font-family:var(--display);font-size:18px}

/* sheets */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheetbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background:rgba(11,11,13,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.iconbtn{background:var(--raised);border:1px solid var(--line);border-radius:99px;padding:7px 13px;font-weight:600}
.iconbtn.on{color:var(--gold);border-color:var(--gold)}
.sheetbody{max-width:720px;margin:0 auto;padding:16px;display:grid;gap:16px}
.hero{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;background:var(--raised)}
.dtitle{font-size:clamp(24px,6.5vw,32px);font-weight:800;line-height:1.1}
.macros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.macro{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:1px}
.macro .v{font-family:var(--display);font-weight:800;font-size:20px}
.macro .v.na{color:var(--muted)}
.macro.cal .v{color:var(--accent)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:99px;background:var(--raised);border:1px solid var(--line);font-size:18px;line-height:1}
.ings{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ings label{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-radius:8px;cursor:pointer}
.ings input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.ings input:checked+span{color:var(--muted);text-decoration:line-through}
.ings .q{font-weight:600;color:var(--accent)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px}
.steps li::before{content:counter(s);font-family:var(--mono);font-size:13px;width:26px;height:26px;border-radius:99px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions .btn{padding:12px 10px}
.actions .wide{grid-column:1/-1}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* edit form */
.form{display:grid;gap:12px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:420px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.notice{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;font-size:13px}
.notice.warn{background:#2b2110;border-color:var(--warn)}

/* cooking mode */
.cook{display:flex;flex-direction:column;min-height:100%}
.cookbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:720px;width:100%;margin:0 auto;padding:20px 20px 8px}
.cookstep{font-size:clamp(22px,6vw,32px);line-height:1.35;font-weight:500}
.progress{height:4px;background:var(--empty);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.cooknav{display:grid;grid-template-columns:1fr 2fr;gap:10px;max-width:720px;width:100%;margin:0 auto;padding:12px 20px 20px}
.cooknav .btn{padding:16px;font-size:17px}
.drawer{background:var(--surface);border-top:1px solid var(--line);max-height:45vh;overflow-y:auto;padding:12px 20px}

/* grocery */
.glist{display:grid;gap:14px}
.ggroup h3{font-size:15px;margin-bottom:4px}
.gitem{display:flex;gap:10px;align-items:flex-start;padding:8px 4px;border-bottom:1px solid var(--line)}
.gitem input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
.gitem span{flex:1}
.gitem input:checked+span{color:var(--muted);text-decoration:line-through}
.gitem button{background:none;border:0;color:var(--muted);font-size:18px;line-height:1;padding:0 4px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:500;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.foot{text-align:center;font-size:12px;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;vertical-align:-2px;margin-right:6px}
@media (prefers-reduced-motion:no-preference){.spin{animation:spin .8s linear infinite}.sheet:not([hidden]){animation:up .22s ease-out}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--raised);border:1px solid var(--line);border-radius:99px;padding:3px;justify-self:start}
.seg button{background:none;border:0;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ings .alt{color:var(--muted);font-size:.92em}
.swipe{position:relative;border-radius:12px;overflow:hidden;min-width:0;touch-action:pan-y}
.swipe .card{position:relative;z-index:1;width:100%;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.swdel{position:absolute;inset:0 0 0 auto;width:110px;background:var(--bad);color:#fff;border:0;font-weight:700;padding-left:18px;display:flex;align-items:center;justify-content:center;visibility:hidden}
.swipe.open .swdel,.swipe:has(.card[style*="translateX"]) .swdel{visibility:visible}
.toast{display:flex;align-items:center;gap:12px;width:max-content}
.toastbtn{background:none;border:0;color:#1550c8;font-weight:700;padding:2px 4px}
.cards .swipe .card{border-radius:12px}
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video.tall{aspect-ratio:auto;height:min(580px,62dvh);max-width:340px;margin-inline:auto;background:#000}
.video.ig{aspect-ratio:auto;height:min(560px,60dvh);max-width:420px;margin-inline:auto;background:#fff}
.tw{position:relative;display:block;width:96px;height:96px}
.play{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:99px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;display:grid;place-items:center;padding-left:2px}
</style>
</head>
<body>
<div class="wrap">
  <header class="appbar">
    <h1>Recipes</h1>
    <div class="menuwrap">
      <button type="button" class="pill" id="viewBtn" aria-haspopup="true" aria-expanded="false" aria-controls="viewMenu"><span id="viewName">Recipes</span><svg viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="menu" id="viewMenu" hidden>
        <button type="button" data-v="list"><b>Recipes</b><span>Find, cook and add recipes</span></button>
        <button type="button" data-v="grocery"><b>Grocery list</b><span id="menuGroc">Ingredients for the store</span></button>
        <hr>
        <a href="./"><b>Daily Ledger ↗</b><span>Back to your habits</span></a>
      </div>
    </div>
  </header>

  <!-- RECIPES -->
  <main id="vList" class="view" style="display:grid;gap:14px">
    <form class="panel" id="importForm" novalidate>
      <label for="importUrl" class="lbl">Add a recipe</label>
      <div class="row">
        <input id="importUrl" class="field" type="text" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Paste a recipe link">
        <button type="submit" class="btn primary" id="importBtn">Import</button>
      </div>
      <div class="err" id="importErr" hidden></div>
    </form>
    <input id="search" class="field" type="search" placeholder="Search recipes or ingredients" autocomplete="off" aria-label="Search recipes">
    <div class="chips" id="tagChips" role="toolbar" aria-label="Filter by tag"></div>
    <div class="cards" id="cards"></div>
  </main>

  <!-- GROCERY -->
  <main id="vGrocery" class="view" hidden style="display:grid;gap:14px">
    <form class="panel" id="gAddForm" novalidate>
      <label for="gAdd" class="lbl">Add an item</label>
      <div class="row"><input id="gAdd" class="field" type="text" placeholder="e.g. paper towels" autocomplete="off"><button class="btn primary" type="submit">Add</button></div>
    </form>
    <div class="panel">
      <div class="sectionhead"><h2 style="font-size:18px">Grocery list</h2><span class="src num" id="gCount"></span></div>
      <div class="glist" id="glist"></div>
      <div class="row" id="gTools">
        <button type="button" class="btn" id="gClearDone">Clear checked</button>
        <button type="button" class="btn danger" id="gClearAll">Clear all</button>
        <span id="gConfirm" hidden class="row"><span class="src">Remove everything?</span><button type="button" class="btn danger" id="gClearYes">Yes, clear</button><button type="button" class="btn" id="gClearNo">Cancel</button></span>
      </div>
    </div>
  </main>

  <footer class="foot"><span id="status">Loading…</span></footer>
</div>

<!-- RECIPE DETAIL -->
<section class="sheet" id="detail" hidden aria-label="Recipe">
  <div class="sheetbar">
    <button type="button" class="iconbtn" id="dBack">&larr; Recipes</button>
    <div class="row" style="flex-wrap:nowrap">
      <button type="button" class="iconbtn" id="dFav" aria-pressed="false">☆ Favorite</button>
      <button type="button" class="iconbtn" id="dEdit">Edit</button>
    </div>
  </div>
  <div class="sheetbody" id="dBody"></div>
</section>

<!-- EDIT -->
<section class="sheet" id="edit" hidden aria-label="Edit recipe">
  <div class="sheetbar">
    <button type="button" class="iconbtn" id="eCancel">Cancel</button>
    <b id="eHeading">Review recipe</b>
    <button type="button" class="iconbtn" id="eSave" style="background:var(--accent);border-color:var(--accent);color:var(--on-accent)">Save</button>
  </div>
  <form class="sheetbody form" id="eForm" novalidate>
    <div id="eNotice"></div>
    <label for="eTitle">Title<input id="eTitle" class="field" type="text"></label>
    <div class="grid2">
      <label for="eServ">Servings<input id="eServ" class="field" type="number" inputmode="numeric" min="1"></label>
      <label for="eTime">Total time (min)<input id="eTime" class="field" type="number" inputmode="numeric" min="0"></label>
    </div>
    <div>
      <div class="lbl" style="margin-bottom:6px">Per serving</div>
      <div class="grid4">
        <label for="eCal">Calories<input id="eCal" class="field" type="number" inputmode="numeric" min="0"></label>
        <label for="ePro">Protein (g)<input id="ePro" class="field" type="number" inputmode="numeric" min="0"></label>
        <label for="eCarb">Carbs (g)<input id="eCarb" class="field" type="number" inputmode="numeric" min="0"></label>
        <label for="eFat">Fat (g)<input id="eFat" class="field" type="number" inputmode="numeric" min="0"></label>
      </div>
      <div class="src" style="margin-top:6px">After importing into Lose It, type its numbers here if they differ.</div>
    </div>
    <div>
      <div class="lbl" style="margin-bottom:6px">Tags</div>
      <div class="chips" id="eTags" style="flex-wrap:wrap"></div>
      <div class="row" style="margin-top:8px"><input id="eTagNew" class="field" type="text" placeholder="Add your own tag"><button type="button" class="btn" id="eTagAdd">Add tag</button></div>
    </div>
    <label for="eIng">Ingredients (one per line)<textarea id="eIng" class="field"></textarea></label>
    <label for="eSteps">Steps (one per line)<textarea id="eSteps" class="field" style="min-height:180px"></textarea></label>
    <label for="eNotes">Notes<textarea id="eNotes" class="field" style="min-height:70px" placeholder="Swaps, tips, what to change next time"></textarea></label>
    <label for="eImg">Photo link<input id="eImg" class="field" type="text" inputmode="url" autocapitalize="off" autocorrect="off"></label>
    <label for="eVideo">Video link: YouTube, TikTok or Instagram (optional)<input id="eVideo" class="field" type="text" inputmode="url" autocapitalize="off" autocorrect="off" placeholder="https://…"></label>
    <label for="eUrl">Recipe link<input id="eUrl" class="field" type="text" inputmode="url" autocapitalize="off" autocorrect="off"></label>
    <div id="eDelete"></div>
  </form>
</section>

<!-- COOKING MODE -->
<section class="sheet" id="cook" hidden aria-label="Cooking mode">
  <div class="cook">
    <div class="sheetbar">
      <button type="button" class="iconbtn" id="cDone">Done</button>
      <b class="num" id="cCount"></b>
      <button type="button" class="iconbtn" id="cIngBtn" aria-expanded="false">Ingredients</button>
    </div>
    <div class="drawer" id="cDrawer" hidden><ul class="ings" id="cIngs"></ul></div>
    <div class="cookbody">
      <div class="progress"><i id="cBar"></i></div>
      <div class="cookstep" id="cStep" aria-live="polite"></div>
      <div class="src" id="cWake"></div>
    </div>
    <div class="cooknav">
      <button type="button" class="btn" id="cPrev">Back</button>
      <button type="button" class="btn primary" id="cNext">Next step</button>
    </div>
  </div>
</section>

<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ---------- connection (same backend as Daily Ledger) ---------- */
const API={url:"https://script.google.com/macros/s/AKfycbyaUKLvN21alTRATQmHNG3xtqFBP3xZciK7PpAwSXQrBx_rgIDD6GU7lV1eCqIW1smZnA/exec",key:"M64H-T3SR-93BT"};
const PRESET_TAGS=["Breakfast","Lunch","Dinner","Snack","High protein","Quick","Meal prep","Dessert"];

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const todayKey=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const LS="recipes.v1";
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

let recipes=[], grocery=[], filterTag="All", query="", openId=null, servings=null;
const cached=lsGet(LS); if(cached){recipes=cached.recipes||[];grocery=cached.grocery||[]}
const cache=()=>lsSet(LS,{recipes,grocery});

let toastT;
function toast(msg,action,fn){const t=$("toast");t.textContent=msg;
  if(action){const b=document.createElement("button");b.type="button";b.className="toastbtn";b.textContent=action;b.onclick=()=>{t.hidden=true;fn()};t.appendChild(b)}
  t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,action?5000:3200)}

/* ---------- server ---------- */
async function post(body){
  const r=await fetch(API.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({key:API.key},body))});
  return r.json();
}
const queue=[];let busy=false;
function enqueue(req){queue.push(req);$("status").textContent="Saving…";flush()}
async function flush(){
  if(busy||!queue.length) return; busy=true;
  try{const j=await post(queue[0]); if(j.error&&j.error!=="bad_request") throw new Error(j.error); queue.shift(); $("status").textContent=queue.length?"Saving…":"Saved"}
  catch(e){$("status").textContent="Offline. Will retry…";busy=false;setTimeout(flush,5000);return}
  busy=false;flush();
}
async function load(){

/* ---------- ingredient scaling ---------- */
const UNI={"¼":.25,"½":.5,"¾":.75,"⅓":1/3,"⅔":2/3,"⅛":.125,"⅜":.375,"⅝":.625,"⅞":.875};
const NUMRE=/^(\d+\s+\d+\/\d+|\d+\/\d+|\d*\.\d+|\d+(?:\s*[¼½¾⅓⅔⅛⅜⅝⅞])?|[¼½¾⅓⅔⅛⅜⅝⅞])/;
function toNum(t){t=t.trim();let n=0;
  const u=t.match(/[¼½¾⅓⅔⅛⅜⅝⅞]/); if(u){n+=UNI[u[0]];t=t.replace(u[0],"").trim()}
  if(!t) return n;
  if(t.includes(" ")){const[a,b]=t.split(/\s+/);return n+Number(a)+toNum(b)}
  if(t.includes("/")){const[a,b]=t.split("/");return n+Number(a)/Number(b)}
  return n+Number(t)}
function fmt(n){
  const w=Math.floor(n+1e-9), f=n-w;
  const fr=[[0,""],[.125,"⅛"],[.25,"¼"],[1/3,"⅓"],[.375,"⅜"],[.5,"½"],[.625,"⅝"],[2/3,"⅔"],[.75,"¾"],[.875,"⅞"],[1,""]];
  let best=fr[0]; fr.forEach(x=>{if(Math.abs(x[0]-f)<Math.abs(best[0]-f))best=x});
  if(Math.abs(best[0]-f)>.07) return String(Math.round(n*10)/10);
  const whole=best[0]===1?w+1:w;
  return (whole?whole:"")+(best[1]||"")||"0";
}
/** Returns {q, rest}: the scaled amount and the rest of the line. */
function scaleLine(line,f){
  const s=line.trim(); const m=s.match(NUMRE);
  if(!m) return {q:"",rest:s};
  let q=fmt(toNum(m[0])*f), rest=s.slice(m[0].length);
  const r=rest.match(/^\s*(?:-|–|to)\s*(\d+\/\d+|\d*\.\d+|\d+)/);
  if(r){q+="–"+fmt(toNum(r[1])*f);rest=rest.slice(r[0].length)}
  return {q,rest};
}

/* ---------- videos: YouTube, TikTok, Instagram ---------- */
const ytId=u=>{const m=String(u||"").match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null};
function videoInfo(u){
  u=String(u||""); let m;
  if((m=ytId(u))) return {kind:"YouTube",key:"yt:"+m,embed:`https://www.youtube-nocookie.com/embed/${m}?rel=0&playsinline=1`,cls:"wide"};
  if((m=u.match(/tiktok\.com\/.*\/video\/(\d+)/))) return {kind:"TikTok",key:"tt:"+m[1],embed:`https://www.tiktok.com/embed/v2/${m[1]}`,cls:"tall"};
  if(/tiktok\.com\//.test(u)) return {kind:"TikTok",key:"tt:"+u,embed:null};
  if((m=u.match(/instagram\.com\/(p|reel|reels|tv)\/([A-Za-z0-9_-]+)/))) return {kind:"Instagram",key:"ig:"+m[2],embed:`https://www.instagram.com/${m[1]==="p"?"p":"reel"}/${m[2]}/embed/`,cls:"ig"};
  return null;
}
const isVideo=u=>!!videoInfo(u);
function videoBlock(r){const v=videoInfo(r.video);if(!v)return "";
  const link=`<a class="src" href="${esc(r.video)}" target="_blank" rel="noopener" style="color:var(--accent)">Open in ${v.kind} ↗</a>`;

  return `<div class="video ${v.cls}"><iframe src="${v.embed}" title="Recipe video" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin" scrolling="no"></iframe></div>${link}`}

/* ---------- grams ---------- */
const ML={cup:236.6,tbsp:14.79,tsp:4.93,floz:29.57,pint:473.2,quart:946.4,gallon:3785};
// grams per ml for common ingredients (checked in order, so more specific names come first)
const DENS=[[/brown sugar/,0.93],[/powdered sugar|confectioners|icing sugar/,0.51],[/sugar/,0.85],
  [/all[- ]purpose flour|bread flour|whole wheat flour|flour/,0.53],[/almond flour/,0.41],[/cocoa/,0.36],
  [/butter(?!milk)|ghee/,0.96],[/peanut butter|almond butter/,1.09],[/olive oil|vegetable oil|canola oil|coconut oil|avocado oil|\boil\b/,0.92],
  [/honey/,1.42],[/maple syrup|syrup/,1.36],[/greek yogurt|yogurt/,1.03],[/heavy cream|cream/,1.0],
  [/milk|buttermilk/,1.03],[/water|broth|stock/,1.0],[/rolled oats|oats/,0.38],[/rice/,0.78],
  [/shredded cheese|grated cheese|parmesan/,0.45],[/salt/,1.2],[/vanilla|extract/,0.88],
  [/dried oregano|dried thyme|dried basil|italian seasoning|dried parsley|dried rosemary|oregano|thyme/,0.2],
  [/black pepper|ground pepper|pepper(?!s| flakes)/,0.47],[/red pepper flakes|chili flakes/,0.35],
  [/cumin|paprika|cinnamon|chili powder|chile powder|garlic powder|onion powder|turmeric|ground ginger|nutmeg|cayenne|curry powder|coriander|allspice|cloves ground|mustard powder/,0.55],[/baking soda|baking powder/,0.9],[/protein powder/,0.42]];
const UNITRE=/^\s*(cups?|c\.(?=\s)|tablespoons?|tbsps?|tbs|tbl|T(?=\s)|teaspoons?|tsps?|t(?=\s)|fluid ounces?|fl\.?\s*oz|ounces?|oz|pounds?|lbs?|pints?|pts?|quarts?|qts?|gallons?|gal)\.?(?=[\s,(]|$)/;
function unitKey(u){u=u.replace(/\.$/,"");
  if(/^(cups?|c)$/i.test(u)) return "cup";
  if(/^(tablespoons?|tbsps?|tbs|tbl|T)$/.test(u)) return "tbsp";
  if(/^(teaspoons?|tsps?|t)$/.test(u)) return "tsp";
  if(/fl/i.test(u)) return "floz";
  if(/^(ounces?|oz)$/i.test(u)) return "oz";
  if(/^(pounds?|lbs?)$/i.test(u)) return "lb";
  if(/^(pints?|pts?)$/i.test(u)) return "pint"; if(/^(quarts?|qts?)$/i.test(u)) return "quart"; if(/^(gallons?|gal)$/i.test(u)) return "gallon";
  return null}
function roundG(g){return g>=100?Math.round(g/5)*5:g>=10?Math.round(g):Math.round(g*2)/2}
/** Converts an ingredient line to grams (or ml), after scaling. Falls back to the scaled original. */
function metricLine(line,f){
  const s=line.trim(), m=s.match(NUMRE); if(!m) return {q:"",rest:s};
  let rest=s.slice(m[0].length), n=toNum(m[0])*f, n2=null;
  const r=rest.match(/^\s*(?:-|–|to)\s*(\d+\/\d+|\d*\.\d+|\d+)/); if(r){n2=toNum(r[1])*f;rest=rest.slice(r[0].length)}
  const u=rest.match(UNITRE); if(!u) return scaleLine(line,f);
  const key=unitKey(u[1]); if(!key) return scaleLine(line,f);
  const after=rest.slice(u[0].length), name=after.toLowerCase();
  const orig=fmt(n)+(n2!=null?"–"+fmt(n2):"")+" "+u[1].replace(/\.$/,"");
  const spoon=key==="tsp"||key==="tbsp";   // spoons read first, grams second
  const show=(conv,unit)=>{const g=roundG(conv(n))+(n2!=null?"–"+roundG(conv(n2)):"")+" "+unit;
    return {q:spoon?orig:g,alt:spoon?g:orig,rest:after.replace(/^\s*(of\s+)?/," ")}};
  if(key==="oz") return show(x=>x*28.35,"g");
  if(key==="lb") return show(x=>x*453.6,"g");
  const d=DENS.find(([re])=>re.test(name));
  if(d) return show(x=>x*ML[key]*d[1],"g");
  if(/juice|wine|vinegar|sauce|soy|beer|coffee|tea\b|liquid|puree|purée/.test(name)) return show(x=>x*ML[key],"ml");
  return scaleLine(line,f);   // spices and things we can't weigh reliably stay as written
}
const lineFor=(l,f)=>metricLine(l,f);   // grams first, original amount alongside when they differ
const stepFor=t=>t;   // temperatures stay in °F

function allTags(){const set=new Set();recipes.forEach(r=>(r.tags||[]).forEach(t=>set.add(t)));
  return PRESET_TAGS.filter(t=>set.has(t)).concat([...set].filter(t=>!PRESET_TAGS.includes(t)).sort())}
function renderChips(){
  const tags=["All","★ Favorites",...allTags()];
  if(!tags.includes(filterTag)) filterTag="All";
  $("tagChips").innerHTML=tags.map(t=>`<button type="button" class="chip" aria-pressed="${t===filterTag}" data-t="${esc(t)}">${esc(t)}</button>`).join("");

function matches(r){

  if(filterTag!=="All"&&filterTag!=="★ Favorites"&&!(r.tags||[]).includes(filterTag)) return false;
  if(!query) return true;
  const hay=(r.title+" "+(r.tags||[]).join(" ")+" "+(r.ingredients||[]).join(" ")).toLowerCase();
  return query.toLowerCase().split(/\s+/).every(w=>hay.includes(w));
}
function cardMeta(r){

}
const PH='<div class="thumb ph" aria-hidden="true"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 7c0-1 1-1.5 1-2.5M12 7c0-1 1-1.5 1-2.5M16 7c0-1 1-1.5 1-2.5"/></svg></div>';

}

/* swipe a card left to reveal Delete */
const OPEN=-92; let sw=null, openSwipe=null, swiped=false;
function setX(card,x,anim){card.style.transition=anim?"transform .2s ease":"none";card.style.transform=x?`translateX(${x}px)`:"";card.parentElement.classList.toggle("open",x<0)}
function closeSwipe(){if(openSwipe){setX(openSwipe,0,true);openSwipe=null}}
$("cards").addEventListener("pointerdown",e=>{const c=e.target.closest(".card");if(!c)return;
  if(openSwipe&&openSwipe!==c)closeSwipe();
  sw={card:c,x0:e.clientX,y0:e.clientY,base:c===openSwipe?OPEN:0,dir:null,id:e.pointerId};swiped=false});
$("cards").addEventListener("pointermove",e=>{if(!sw||e.pointerId!==sw.id)return;
  const dx=e.clientX-sw.x0, dy=e.clientY-sw.y0;
  if(!sw.dir){if(Math.abs(dx)<8&&Math.abs(dy)<8)return; sw.dir=Math.abs(dx)>Math.abs(dy)?"h":"v"; if(sw.dir==="h"){try{sw.card.setPointerCapture(e.pointerId)}catch(_){}}}
  if(sw.dir!=="h")return; swiped=true;
  setX(sw.card,Math.max(OPEN-30,Math.min(0,sw.base+dx)),false)});
function endSwipe(e){if(!sw||e.pointerId!==sw.id)return;
  if(sw.dir==="h"){const m=new DOMMatrix(getComputedStyle(sw.card).transform).m41; if(m<OPEN/2){setX(sw.card,OPEN,true);openSwipe=sw.card}else{setX(sw.card,0,true);if(openSwipe===sw.card)openSwipe=null}}
  sw=null}
$("cards").addEventListener("pointerup",endSwipe);

/* delete with a few seconds to undo */
let pendingDel=null;
function deleteWithUndo(id){
  commitDelete();

  const rec=recipes[i]; recipes.splice(i,1); openSwipe=null; cache(); renderList();
  if(!$("detail").hidden&&openId===id){$("detail").hidden=true;openId=null}
  pendingDel={rec,i,t:setTimeout(commitDelete,5000)};
  toast(`Deleted “${rec.title}”.`,"Undo",()=>{clearTimeout(pendingDel.t);recipes.splice(Math.min(pendingDel.i,recipes.length),0,pendingDel.rec);pendingDel=null;cache();renderList()});
}

  let note="";
  if(isNew&&r.partial&&r.fromVideo) note='<div class="notice warn">Saved the video, but its caption has no recipe to read. Add the ingredients and steps you need, or paste the creator\'s written-recipe link into Recipe link.</div>';
  else if(isNew&&r.partial) note='<div class="notice warn">This site doesn\'t share its recipe in a readable format, so fill in what you need. Tip: Lose It\'s importer may still read it.</div>';
  else if(isNew&&r.fromVideo&&!isVideo(r.url)){let h="";try{h=new URL(r.url).hostname.replace(/^www\./,"")}catch(e){}note=`<div class="notice">Found the written recipe on ${esc(h||"the creator's site")} from the video's caption${(r.nutrition||{}).calories!=null?", with nutrition":""}. The video is saved too. Check it over, add tags, then Save.</div>`}
  else if(isNew&&r.fromVideo) note='<div class="notice">Saved the video. There was no written-recipe link, so these ingredients and steps were read from the caption itself. Check them over before saving.</div>';
  else if(isNew) note=`<div class="notice">Imported${(r.nutrition||{}).calories!=null?" with the site's nutrition":", but the site doesn't list nutrition. Add Lose It's numbers below once you import it there"}. Check it over, add tags, then Save.</div>`;
  $("eNotice").innerHTML=note;
  $("eDelete").innerHTML=isNew?"":'<button type="button" class="btn danger" id="eDel">Delete recipe</button><span id="eDelConfirm" hidden class="row" style="margin-top:8px"><span class="src">Delete this recipe for good?</span><button type="button" class="btn danger" id="eDelYes">Delete</button><button type="button" class="btn" id="eDelNo">Keep</button></span>';
  if(!isNew){$("eDel").onclick=()=>{$("eDelConfirm").hidden=false};$("eDelNo").onclick=()=>{$("eDelConfirm").hidden=true};
    $("eDelYes").onclick=()=>{const id=draft.id;$("edit").hidden=true;draft=null;deleteWithUndo(id)}}
  renderTagEdit(); $("edit").hidden=false; $("edit").scrollTop=0;
}
function renderTagEdit(){
  const tags=[...new Set([...PRESET_TAGS,...allTags(),...(draft.tags||[])])];
  $("eTags").innerHTML=tags.map(t=>`<button type="button" class="chip" aria-pressed="${(draft.tags||[]).includes(t)}" data-t="${esc(t)}">${esc(t)}</button>`).join("");
}
$("eTags").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;const t=b.dataset.t;draft.tags=(draft.tags||[]).includes(t)?draft.tags.filter(x=>x!==t):(draft.tags||[]).concat([t]);renderTagEdit()});
$("eTagAdd").onclick=()=>{const t=$("eTagNew").value.trim();if(t&&!(draft.tags||[]).includes(t)){draft.tags=(draft.tags||[]).concat([t])}$("eTagNew").value="";renderTagEdit()};
$("eTagNew").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("eTagAdd").click()}});
$("eCancel").onclick=()=>{$("edit").hidden=true;draft=null};
$("eSave").onclick=()=>{
  const num=id=>{const v=$(id).value.trim();return v===""?null:Math.round(Number(v))};
  const lines=id=>$(id).value.split("\n").map(s=>s.trim()).filter(Boolean);
  Object.assign(draft,{title:$("eTitle").value.trim()||"Untitled recipe",servings:num("eServ"),time:num("eTime"),
    nutrition:{calories:num("eCal"),protein:num("ePro"),carbs:num("eCarb"),fat:num("eFat")},
    ingredients:lines("eIng"),steps:lines("eSteps"),notes:$("eNotes").value.trim(),image:$("eImg").value.trim(),url:$("eUrl").value.trim()});
  {const v=$("eVideo").value.trim(); draft.video=isVideo(v)?v:"";}
  delete draft.partial;
  const i=recipes.findIndex(x=>x.id===draft.id); if(i>=0) recipes[i]=draft; else recipes.unshift(draft);
  cache(); enqueue({action:"saveRecipe",recipe:draft});
  $("edit").hidden=true; renderList(); openDetail(draft.id); toast(draftNew?"Recipe saved.":"Changes saved."); draft=null;
};

/* ---------- cooking mode ---------- */
let stepI=0, wake=null;
async function openCook(){
  stepI=0; const r=byId(openId), f=servings/(r.servings||1);
  $("cIngs").innerHTML=(r.ingredients||[]).map((l,i)=>{const s=lineFor(l,f);return `<li><label><input type="checkbox" id="cing${i}"><span>${s.q?`<span class="q">${esc(s.q)}</span>`:""}${s.alt?` <span class="alt">(${esc(s.alt)})</span>`:""}${esc(s.rest)}</span></label></li>`}).join("");
  $("cDrawer").hidden=true; $("cIngBtn").setAttribute("aria-expanded","false");
  renderCook(); $("cook").hidden=false;
  try{wake=await navigator.wakeLock.request("screen");$("cWake").textContent="Screen will stay on while you cook."}catch(e){$("cWake").textContent=""}
}
function renderCook(){
  const steps=byId(openId).steps||[];
  $("cCount").textContent=`Step ${stepI+1} of ${steps.length}`;
  $("cStep").textContent=stepFor(steps[stepI]||"");
  $("cBar").style.width=((stepI+1)/steps.length*100)+"%";
  $("cPrev").disabled=stepI===0;
  $("cNext").textContent=stepI===steps.length-1?"Finish":"Next step";
}
function closeCook(){$("cook").hidden=true;try{wake&&wake.release()}catch(e){}wake=null}
$("cPrev").onclick=()=>{if(stepI>0){stepI--;renderCook()}};
$("cNext").onclick=()=>{const n=(byId(openId).steps||[]).length;if(stepI<n-1){stepI++;renderCook()}else{closeCook();toast("Done! Tap “I cooked this” to log it.")}};
$("cDone").onclick=closeCook;
$("cIngBtn").onclick=()=>{const d=$("cDrawer");d.hidden=!d.hidden;$("cIngBtn").setAttribute("aria-expanded",!d.hidden)};

/* ---------- grocery ---------- */
let gTimer;
function saveGrocery(){cache();renderGrocery();clearTimeout(gTimer);gTimer=setTimeout(()=>enqueue({action:"saveGrocery",items:grocery}),700)}
function renderGrocery(){
  const left=grocery.filter(g=>!g.done).length;
  $("gCount").textContent=grocery.length?`${left} left`:"";
  $("menuGroc").textContent=left?`${left} item${left===1?"":"s"} to buy`:"Ingredients for the store";
  $("gTools").hidden=!grocery.length;
  if(!grocery.length){$("glist").innerHTML='<div class="empty"><b>Your list is empty</b><span>Open a recipe and tap “Add to grocery list”, or add items above.</span></div>';return}
  const groups={}; grocery.forEach(g=>{(groups[g.recipe||"Other"]=groups[g.recipe||"Other"]||[]).push(g)});
  $("glist").innerHTML=Object.entries(groups).map(([name,items])=>`<div class="ggroup"><h3>${esc(name)}</h3>${items.map(g=>`<label class="gitem"><input type="checkbox" data-id="${g.id}" ${g.done?"checked":""}><span>${esc(g.text)}</span><button type="button" data-del="${g.id}" aria-label="Remove ${esc(g.text)}">×</button></label>`).join("")}</div>`).join("");
}
$("glist").addEventListener("change",e=>{const id=e.target.dataset.id;const g=grocery.find(x=>x.id===id);if(g){g.done=e.target.checked;saveGrocery()}});
$("glist").addEventListener("click",e=>{const id=e.target.dataset&&e.target.dataset.del;if(id){e.preventDefault();grocery=grocery.filter(x=>x.id!==id);saveGrocery()}});
$("gAddForm").addEventListener("submit",e=>{e.preventDefault();const t=$("gAdd").value.trim();if(!t)return;grocery.push({id:Math.random().toString(36).slice(2,9),text:t,recipe:"Other",done:false});$("gAdd").value="";saveGrocery()});
$("gClearDone").onclick=()=>{grocery=grocery.filter(g=>!g.done);saveGrocery()};
$("gClearAll").onclick=()=>{$("gConfirm").hidden=false};
$("gClearNo").onclick=()=>{$("gConfirm").hidden=true};
$("gClearYes").onclick=()=>{grocery=[];$("gConfirm").hidden=true;saveGrocery()};

/* ---------- screens ---------- */
const VIEWS={list:"Recipes",grocery:"Grocery list"};
function setView(v){
  $("vList").hidden=v!=="list"; $("vGrocery").hidden=v!=="grocery";
  $("viewName").textContent=VIEWS[v];
  document.querySelectorAll("#viewMenu [data-v]").forEach(b=>b.setAttribute("aria-current",b.dataset.v===v));
  closeMenu(); window.scrollTo(0,0);
}
function closeMenu(){$("viewMenu").hidden=true;$("viewBtn").setAttribute("aria-expanded","false")}
$("viewBtn").onclick=e=>{e.stopPropagation();const open=$("viewMenu").hidden;$("viewMenu").hidden=!open;$("viewBtn").setAttribute("aria-expanded",open)};
$("viewMenu").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b)setView(b.dataset.v)});
document.addEventListener("click",e=>{if(!e.target.closest(".menuwrap"))closeMenu()});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;closeMenu();
  if(!$("cook").hidden)closeCook();else if(!$("edit").hidden)$("eCancel").click();else if(!$("detail").hidden)$("dBack").click()});
document.addEventListener("visibilitychange",async()=>{if(document.visibilityState==="visible"){load();if(!$("cook").hidden&&!wake){try{wake=await navigator.wakeLock.request("screen")}catch(e){}}}});

function renderAll(){renderList();renderGrocery();if(openId&&!$("detail").hidden)renderDetail()}
setView("list"); renderAll(); load();
</script>
</body>
</html>
